# 推 v* tag 触发：构建 NSIS 安装包 + 更新包签名 + latest.json，发到 GitHub Releases。
#
# 需要的仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY           ~/.tauri/automoyu.key 的内容（务必另外离线备份！）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  生成时的密码（没设就留空字符串）
#
# 通道：
#   稳定版  → GitHub "latest" release（带 - 的版本号自动标为 prerelease，不会成为 latest）
#   测试版  → 滚动的 updater-beta release，每次发版（含正式版）都刷新它的 latest.json
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AutoMoyu ${{ github.ref_name }}
          releaseBody: |
            见下方更新说明。首次安装：下载 `AutoMoyu_*_x64-setup.exe`，无需管理员权限。
            Windows 可能提示"未知发布者"，点「更多信息 → 仍要运行」。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true

      - name: 刷新测试通道
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json -D out
          gh release view updater-beta >/dev/null 2>&1 || \
            gh release create updater-beta --prerelease --title "更新通道：测试版" \
              --notes "自动维护，请勿手动修改。测试版用户从这里获取更新清单。"
          gh release upload updater-beta out/latest.json --clobber

