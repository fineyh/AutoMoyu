name: 功能建议 / Feature request
description: 想要的新功能或改进 / Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的情况 / The problem
      description: 现在哪里不方便？最好说说具体的游戏场景 / What's inconvenient today? A concrete in-game situation helps.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 希望怎么改 / What you'd like
    validations:
      required: true
