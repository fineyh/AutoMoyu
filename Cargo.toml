[workspace]
resolver = "2"
members = ["crates/moyu-core", "crates/moyu-win", "crates/moyu-bench", "src-tauri"]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2021"
authors = ["fineyh"]
license = "MIT"
repository = "https://github.com/fineyh/AutoMoyu"

[workspace.dependencies]
moyu-core = { path = "crates/moyu-core" }
moyu-win = { path = "crates/moyu-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 算法在 debug 下也要够快（校准滑窗、回放）
[profile.dev.package.moyu-core]
opt-level = 2
